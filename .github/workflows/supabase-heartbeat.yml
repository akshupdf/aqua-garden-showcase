name: Supabase Heartbeat Monitor

on:
  schedule:
    # Run every 6 hours (prevents Free Tier pause)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Supabase heartbeat
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node supabase-heartbeat.js

      - name: Report success
        if: success()
        run: echo "✅ Supabase heartbeat successful - project remains active"

      - name: Report failure
        if: failure()
        run: echo "❌ Supabase heartbeat failed - project may pause soon"